name: Build LeviVoxelSmoothGI Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "include/**"
      - "generated/**"
      - "prewarm/**"
      - "config/**"
      - "CMakeLists.txt"
      - "manifest.json.in"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3

      - name: Reuse Android NDK/CMake when present
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          if [ -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
            echo "NDK 28.2.13676358 already installed: $NDK"
          else
            sdkmanager "ndk;28.2.13676358"
          fi
          if command -v cmake >/dev/null 2>&1 && cmake --version | grep -qE '3\\.(2[2-9]|[3-9][0-9])\\.'; then
            echo "Compatible CMake already installed: $(command -v cmake)"
          else
            sdkmanager "cmake;3.22.1"
            echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          fi

      - name: Cache native build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/levi-build-deps/preloader-android-0.2.2
            ~/.cache/levi-build-deps/fmt-11.2.0
            ~/.cache/levi-build-deps/fetchcontent
          key: levi-native-deps-preloader-0.2.2-fmt-11.2.0-configdeps-fetchcontent-v4

      - name: Find or fetch preloader and fmt
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          DEPS="$HOME/.cache/levi-build-deps"
          PRELOADER="${PRELOADER_ANDROID_ROOT:-$DEPS/preloader-android-0.2.2}"
          FMT="${FMT_ROOT:-$DEPS/fmt-11.2.0}"
          mkdir -p "$DEPS"

          if [ -f "$PRELOADER/include/pl/Mod.hpp" ]; then
            echo "Using cached preloader-android: $PRELOADER"
          else
            FOUND="$(find "$HOME" "$RUNNER_TEMP" -type f -path '*/preloader-android*/include/pl/Mod.hpp' -print -quit 2>/dev/null || true)"
            if [ -n "$FOUND" ]; then
              PRELOADER="${FOUND%/include/pl/Mod.hpp}"
              echo "Found preloader-android: $PRELOADER"
            else
              rm -rf "$PRELOADER"
              git clone --depth 1 --branch 0.2.2 https://github.com/LiteLDev/preloader-android.git "$PRELOADER"
            fi
          fi

          if [ -f "$FMT/include/fmt/format.h" ] && [ -f "$FMT/CMakeLists.txt" ]; then
            echo "Using cached fmt: $FMT"
          else
            FOUND="$(find "$HOME" "$RUNNER_TEMP" -type f -path '*/fmt*/include/fmt/format.h' -print -quit 2>/dev/null || true)"
            if [ -n "$FOUND" ]; then
              FMT="${FOUND%/include/fmt/format.h}"
              echo "Found fmt: $FMT"
            else
              rm -rf "$FMT"
              git clone --depth 1 --branch 11.2.0 https://github.com/fmtlib/fmt.git "$FMT"
            fi
          fi

          echo "preloader=$PRELOADER" >> "$GITHUB_OUTPUT"
          echo "fmt=$FMT" >> "$GITHUB_OUTPUT"

      - name: Configure ARM64
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_BASE_DIR="$HOME/.cache/levi-build-deps/fetchcontent" \
            -DPRELOADER_ANDROID_ROOT="${{ steps.deps.outputs.preloader }}" \
            -DFETCHCONTENT_SOURCE_DIR_FMT="${{ steps.deps.outputs.fmt }}"

      - name: Build levipack
        run: cmake --build build --target levi_package -j2

      - name: Validate ELF and package
        shell: bash
        run: |
          set -euo pipefail
          file build/liblevi_voxel_smooth_gi.so
          readelf -h build/liblevi_voxel_smooth_gi.so | grep -E 'Class:|Machine:|Type:'
          readelf -l build/liblevi_voxel_smooth_gi.so | grep -E 'LOAD|Align' || true
          unzip -l build/LeviVoxelSmoothGI-*.levipack

      - uses: actions/upload-artifact@v4
        with:
          name: LeviVoxelSmoothGI-arm64
          path: build/*.levipack
